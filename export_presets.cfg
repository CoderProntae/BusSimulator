; Android export preset for BusSimulator.
; NOTE: a successful APK build also requires the Godot 4 Android
; source/export templates to be installed (Editor -> Manage Export
; Templates). Install those, then run:
;   godot --headless --export-release "Android" BusSimulator.apk

[preset.0]
name="Android"
platform="Android"
export_path="BusSimulator.apk"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
patch_list=PackedStringArray()
encryption_include_filters=PackedStringArray()
encryption_exclude_filters=PackedStringArray()
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=0

[printf_format]

; ---- Android specific options ----
android/use_gradle_build=true
android/use_custom_build=false
android/export_aab=false
android/target_sdk=34
android/min_sdk=21
android/compile_sdk=34
android/install_system_dependencies=false
android/package_name="com.bussimulator.game"
android/version_code=1
android/version_name="1.0"
android/integrated_declaration=false
android/retain_data_on_uninstall=false
android/use_implied_permissions=true
android/use_permissions=true
android/permissions="android.permission.INTERNET,android.permission.ACCESS_NETWORK_STATE,android.permission.VIBRATE"
android/orientation="landscape"
android/hardware_buffer=true
android/xr_mode=0
android/command_line_params=PackedStringArray()
android/extra_permissions=PackedStringArray()
android/apk_expansion=false
android/architecture="arm64-v8a"

; ---- Signing (debug keystore is generated by CI) ----
keystore/debug="debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
