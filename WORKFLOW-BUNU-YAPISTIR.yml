name: Build APK

on:
  push:
    branches: [ dev, main, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -o Godot_v4.4-stable_linux.x86_64.zip
          mv Godot_v4.4-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          unzip -o Godot_v4.4-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.4.stable/

      - name: Keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug,O=Debug,C=US"

      - name: Patch export preset
        run: |
          # Godot resolves the debug keystore from an absolute path.
          sed -i "s|keystore/debug=\".*\"|keystore/debug=\"$GITHUB_WORKSPACE/debug.keystore\"|" export_presets.cfg
          sed -i 's|keystore/debug_user=".*"|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=".*"|keystore/debug_password="android"|' export_presets.cfg

      - name: Import
        run: ./godot --headless --import --quit || true

      - name: Check for script/scene errors
        run: |
          # Second pass: the first import generates .godot/, so this run
          # surfaces only genuine script/scene problems.
          ./godot --headless --import --quit 2>&1 | tee import.log || true
          # Note: "progress dialog (task)" and "cannot connect to daemon at
          # tcp:5037" (adb) are harmless headless-CI noise, so they are not
          # matched here.
          if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate an autoload" import.log; then
            echo "::error::Godot reported script/scene errors during import"
            grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate an autoload" -A1 import.log
            exit 1
          fi
          echo "Project imported cleanly."

      - name: Export APK
        run: ./godot --headless --export-debug "Android" BusSimulator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BusSimulator-APK
          path: BusSimulator.apk
          retention-days: 30
